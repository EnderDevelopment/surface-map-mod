plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.26.2'
    mappings 'net.fabricmc:yarn:1.26.2+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.0'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.102.0+1.26.2'
}

loom {
    accessWidenerPath = 'src/main/resources/accessWidener.txt'
    refreshVersions = true
    refreshDeps {
        refreshMinecraft = true
        refreshMappings = true
    }
}
